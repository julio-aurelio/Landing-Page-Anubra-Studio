<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto Livro — Anubra Studio</title>
  <meta name="description" content="Folheie o foto livro do Anubra Studio." />
  <link rel="icon" href="/assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/fotolivro/livro.css" />
</head>
<body>
  <a class="voltar" href="/">← Voltar ao site</a>

  <main class="palco">
    <h1 class="so-leitor">Foto livro</h1>
    <div id="mesa" class="mesa">
      <div id="livro" aria-busy="true"></div>
    </div>
  </main>

  <div class="progresso" aria-hidden="true"><span id="barra"></span></div>
  <nav class="controles" aria-label="Navegação do livro">
    <button id="anterior" aria-label="Página anterior">←</button>
    <span id="indicador" aria-live="polite"></span>
    <button id="proxima" aria-label="Próxima página">→</button>
  </nav>
  <p id="dica" class="dica"></p>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="/fotolivro/render.js"></script>
  <script src="/fotolivro/padrao.js"></script>
  <script src="/fotolivro/livro.js"></script>
</body>
</html>
